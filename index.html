<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Maintenance</title>
    <style>
        /* CSS Variables for clean theming and easy customization (Defaults to sleek dark mode, adapts to light mode if preferred) */
        :root {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #020617;
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --badge-bg: rgba(56, 189, 248, 0.1);
            --badge-border: rgba(56, 189, 248, 0.3);
        }

        /* Light mode adaptation for users with light system preferences */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-gradient-start: #f1f5f9;
                --bg-gradient-end: #e2e8f0;
                --card-bg: rgba(255, 255, 255, 0.9);
                --card-border: rgba(15, 23, 42, 0.08);
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --accent-color: #0284c7;
                --accent-glow: rgba(2, 132, 199, 0.15);
                --badge-bg: rgba(2, 132, 199, 0.08);
                --badge-border: rgba(2, 132, 199, 0.25);
            }
        }

        /* Reset & Base Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background: radial-gradient(circle at top center, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Main Card Container */
        .maintenance-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 1.5rem;
            padding: 3.5rem 2.5rem;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Animated Gear Icon Wrapper */
        .icon-wrapper {
            position: relative;
            width: 88px;
            height: 88px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        /* Primary & Secondary Gear SVG Styling */
        .gear-primary {
            width: 44px;
            height: 44px;
            color: var(--accent-color);
            animation: spinClockwise 12s linear infinite;
            transform-origin: center;
        }

        .gear-secondary {
            position: absolute;
            bottom: 14px;
            right: 14px;
            width: 24px;
            height: 24px;
            color: var(--accent-color);
            opacity: 0.8;
            animation: spinCounterClockwise 8s linear infinite;
            transform-origin: center;
        }

        /* Status Pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.875rem;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 1.25rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* Main Heading */
        h1 {
            font-size: clamp(1.75rem, 4.5vw, 2.5rem);
            font-weight: 800;
            letter-spacing: 0.04em;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        /* Highlighted Return Date Subheading */
        .return-message {
            font-size: clamp(1.125rem, 2.5vw, 1.35rem);
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        /* Supporting Description */
        .description {
            font-size: 0.975rem;
            color: var(--text-secondary);
            max-width: 420px;
            margin: 0 auto;
        }

        /* Keyframe Animations */
        @keyframes spinClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinCounterClockwise {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .maintenance-card {
                padding: 2.5rem 1.5rem;
                border-radius: 1.25rem;
            }

            .icon-wrapper {
                width: 76px;
                height: 76px;
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <main class="maintenance-card" role="main">
        <!-- Animated Dual Gear SVG Icon -->
        <div class="icon-wrapper" aria-hidden="true">
            <svg class="gear-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <svg class="gear-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </div>

        <!-- Status Indicator -->
        <div class="status-pill">
            <span class="status-dot"></span>
            <span>Scheduled Upgrade</span>
        </div>

        <!-- Main Heading -->
        <h1>SERVER MAINTENANCE</h1>

        <!-- Return Date Subheading -->
        <p class="return-message">We'll be back on December 1, 2026</p>

        <!-- Helpful Context -->
        <p class="description">
            We are currently performing scheduled infrastructure upgrades to improve performance and reliability. Thank you for your patience.
        </p>
    </main>

</body>
</html>
